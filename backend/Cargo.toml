[package]
name = "maiestro"
version = "0.3.0"
description = "Menu-bar launcher for per-issue dev workspaces"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Formats the compile-time build date stamped into the binary (see build.rs, #126).
time = { version = "0.3", features = ["formatting", "macros"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
tokio = { version = "1", features = ["process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
time = { version = "0.3", features = ["formatting", "macros"] }
notify = "6"
chrono = { version = "0.4", features = ["clock"], default-features = false }
jsonschema = { version = "0.46", default-features = false }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# Test-only: enable the runtime + `#[tokio::test]` macro for async tests that
# exercise the real `git` subprocess helpers. Feature-unified into the test build
# only (resolver v2), so the app binary's tokio surface is unchanged.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# Test-only HTTP mock server for the GitHub REST client (base-URL injected via
# GitHub::for_test), covering ETag caching, PAT scope derivation, and the PR
# lifecycle with canned responses — no network, no Keychain.
wiremock = "0.6"
