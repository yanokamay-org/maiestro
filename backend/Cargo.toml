[package]
name = "maiestro"
version = "0.4.4"
description = "Menu-bar launcher for per-issue dev workspaces"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Formats the compile-time build date stamped into the binary (see build.rs, #126).
time = { version = "0.3", features = ["formatting", "macros"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# Each native backend only compiles on its own OS: macOS Keychain, Windows
# Credential Manager.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Home and per-user data dirs from the OS rather than `$HOME`, which Windows
# doesn't reliably set (paths.rs, logging.rs).
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
tokio = { version = "1", features = ["process", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
time = { version = "0.3", features = ["formatting", "macros"] }
notify = "6"
chrono = { version = "0.4", features = ["clock"], default-features = false }
# Version comparison for the update check (tauri already depends on it; listed
# so `PackageInfo.version` and a parsed release tag are the same type here).
semver = "1"
jsonschema = { version = "0.46", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
# `GetForegroundWindow`, to tell a real blur of the popover from focus moving
# off its webview onto its own frame (e.g. a resize drag; `main.rs`), and the
# window enumeration/close/focus calls teardown uses on VS Code (`editor.rs`),
# and the tray-icon overflow read for onboarding (`tray_visibility.rs`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# Windows Terminal sessions (`windows_terminal.rs`): UI Automation (COM) to
# find, select and close a session's tab, and the installed package's version
# (or a portable `wt.exe`'s file version) for Check Health, read without ever
# starting Windows Terminal.
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Foundation_Collections",
  "Management_Deployment",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# Test-only: enable the runtime + `#[tokio::test]` macro for async tests that
# exercise the real `git` subprocess helpers. Feature-unified into the test build
# only (resolver v2), so the app binary's tokio surface is unchanged.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# Test-only HTTP mock server for the GitHub REST client (base-URL injected via
# GitHub::for_test), covering ETag caching, PAT scope derivation, and the PR
# lifecycle with canned responses — no network, no Keychain.
wiremock = "0.6"
